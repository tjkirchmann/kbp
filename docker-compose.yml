services:
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
    depends_on:
      - backend

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend:/app
      - /app/.venv
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/app
      - ALLOWED_ORIGINS=http://localhost:5173
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET=documents
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
      - minio

  procrastinate_worker:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    # Apply Procrastinate's schema only if it isn't there yet (schema --apply is
    # not idempotent and errors on a second run), then run the worker — a custom
    # entrypoint (app/worker.py) that drives CFBD/ESPN schedules from DB-configured
    # crons and re-syncs them on NOTIFY + a poll fallback.
    command:
      - sh
      - -c
      - |
        APP=app.core.procrastinate.procrastinate_app
        if ! procrastinate --app=$$APP healthchecks 2>/dev/null | grep -q 'procrastinate_jobs table: OK'; then
          procrastinate --app=$$APP schema --apply
        fi
        exec python -m app.worker
    volumes:
      - ./src/backend:/app
      - /app/.venv
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/app
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET=documents
    depends_on:
      - db
      - minio

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - pg_data:/var/lib/postgresql/data

  # Local S3-compatible object storage. Code talks the S3 API (aioboto3); in prod
  # the same code points at real AWS S3 instead (S3_ENDPOINT_URL unset).
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  # One-shot: create the documents bucket on startup, then exit.
  minio_init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint:
      - sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done
        mc mb --ignore-existing local/documents

volumes:
  pg_data:
  minio_data:
