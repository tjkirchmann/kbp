services:
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
    depends_on:
      - backend

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend:/app
      - /app/.venv
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/app
      - ALLOWED_ORIGINS=http://localhost:5173
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db

  procrastinate_worker:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    # Apply Procrastinate's schema only if it isn't there yet (schema --apply is
    # not idempotent and errors on a second run), then run the worker — which
    # also drives the @app.periodic CFBD and ESPN schedules.
    command:
      - sh
      - -c
      - |
        APP=app.core.procrastinate.procrastinate_app
        if ! procrastinate --app=$$APP healthchecks 2>/dev/null | grep -q 'procrastinate_jobs table: OK'; then
          procrastinate --app=$$APP schema --apply
        fi
        exec procrastinate --app=$$APP worker
    volumes:
      - ./src/backend:/app
      - /app/.venv
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/app
    depends_on:
      - db

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
