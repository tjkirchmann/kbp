services:
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
    depends_on:
      - backend

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend:/app
      - /app/.venv
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/app
      - ALLOWED_ORIGINS=http://localhost:5173
      # Local S3 = MinIO. Backend reaches it at minio:9000; the browser-facing
      # presigned URLs are signed for localhost:9000 (see app/services/s3.py).
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET_NAME=library
      - S3_REGION=us-east-1
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_PUBLIC_ENDPOINT_URL=http://localhost:9000
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
      - minio

  procrastinate_worker:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    # Apply Procrastinate's schema only if it isn't there yet (schema --apply is
    # not idempotent and errors on a second run), then run the worker — a custom
    # entrypoint (app/worker.py) that drives CFBD/ESPN schedules from DB-configured
    # crons and re-syncs them on NOTIFY + a poll fallback.
    command:
      - sh
      - -c
      - |
        APP=app.core.procrastinate.procrastinate_app
        if ! procrastinate --app=$$APP healthchecks 2>/dev/null | grep -q 'procrastinate_jobs table: OK'; then
          procrastinate --app=$$APP schema --apply
        fi
        exec python -m app.worker
    volumes:
      - ./src/backend:/app
      - /app/.venv
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/app
    depends_on:
      - db

  discord_bot:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    # Long-lived Discord gateway connection: listens for slash commands / messages
    # and posts. Exits cleanly when DISCORD_BOT_TOKEN is unset (bot disabled).
    # Iterate with: docker compose restart discord_bot && docker compose logs -f discord_bot
    command: python -m app.bot
    volumes:
      - ./src/backend:/app
      - /app/.venv
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/app
    depends_on:
      - db

  # ── Temporal ────────────────────────────────────────────────────────────────
  # Self-hosted Temporal for durable workflows (separate from Procrastinate, which
  # still owns the cron/sync jobs). Backed by the existing `db` Postgres in its own
  # `temporal` + `temporal_visibility` databases — one stack, one Postgres. The
  # migration target is managed Temporal Cloud, so auto-setup is fine for dev and
  # this shared-DB coupling never reaches prod. See app/core/temporal.py for the
  # single client seam that makes the Cloud cutover an env-var change.
  temporal:
    image: temporalio/auto-setup:1.29.7
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12          # postgres12 schema plugin supports PG 12+ (incl. 16)
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=db
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
    # auto-setup creates both databases and applies schema on first boot.
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "workflow", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      - db

  temporal-ui:
    image: temporalio/ui:2.51.0
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal

  # Sleeps in the background; provides the `temporal` / `tctl` CLI inside the stack.
  # Use via: docker compose exec temporal-admin-tools temporal workflow list
  temporal-admin-tools:
    image: temporalio/admin-tools:1.29.7-tctl-1.18.4-cli-1.7.2
    stdin_open: true
    tty: true
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    depends_on:
      - temporal

  # Python worker that polls the Temporal task queue and runs our workflows +
  # activities (app/temporal/). Mirrors procrastinate_worker. DATABASE_URL is kept
  # for parity so activities can hit the app DB later.
  temporal_worker:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    command: python -m app.temporal.worker
    volumes:
      - ./src/backend:/app
      - /app/.venv
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/app
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      temporal:
        condition: service_healthy

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - pg_data:/var/lib/postgresql/data

  # Local S3-compatible storage (the "SQLite of S3"). API on :9000, console on :9001.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Allow the Vite dev origin to upload/download directly (presigned POST/GET).
      # MinIO applies CORS at the server level; per-bucket S3 CORS isn't implemented.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
    volumes:
      - minio_data:/data

  # One-shot: wait for MinIO and create the bucket. CORS is handled at the MinIO
  # server level via MINIO_API_CORS_ALLOW_ORIGIN (see the minio service above).
  minio-setup:
    image: minio/mc
    depends_on:
      - minio
    entrypoint:
      - sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done
        mc mb --ignore-existing local/library

volumes:
  pg_data:
  minio_data:
