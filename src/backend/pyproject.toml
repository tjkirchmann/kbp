[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "pydantic==2.11.2",
    "pydantic-settings==2.7.0",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.0",
    "httpx==0.28.1",
    "clerk-backend-api==5.0.6",
    "openai==2.8.0",
    "psycopg2-binary==2.9.9",
    "passlib[bcrypt]==1.7.4",
    "supervisor==4.2.5",
    "discord-py==2.6.4",
    "boto3==1.35.0",
    "temporalio==1.29.0",
    "pydantic-ai-slim[openrouter]==1.50.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
# Relax common FastAPI / SQLAlchemy patterns until stricter mode
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["alembic.*", "alembic.env"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["temporalio.*", "clerk_backend_api.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length is managed by the formatter; long strings/URLs are fine
    "B904",  # raise-without-from: pre-existing; can be enabled in a follow-up
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses these callables as default-argument markers, not mutable defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# Alembic migrations are largely autogenerated; relax unused-import / line rules.
"alembic/versions/*" = ["E501", "F401"]
"alembic/env.py" = ["E501"]
# SQLAlchemy relationship() string forward-refs ("PoolGame", etc.) are resolved
# by the ORM registry at runtime, not real undefined names.
"app/models/*" = ["F821"]
